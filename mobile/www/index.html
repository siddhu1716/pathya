<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Pathya</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #050505; color: #ededed;
           font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
    .logo { width: 40px; height: 40px; border-radius: 10px; background: #ededed; color: #050505;
            display: flex; align-items: center; justify-content: center; font-weight: 600; }
    h1 { font-size: 22px; font-weight: 500; margin: 6px 0 0; letter-spacing: -0.01em; }
    p { margin: 0; color: #9a9a9a; font-size: 14px; }
    input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #2a2a2a; background: #0d0d0d;
            color: #ededed; font-size: 15px; outline: none; }
    input:focus { border-color: #555; }
    button { height: 48px; border-radius: 12px; border: 0; background: #ededed; color: #050505; font-size: 15px; }
    button.ghost { background: transparent; color: #ededed; border: 1px solid #2a2a2a; }
    .error { color: #f87171; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="logo">P</div>
  <section id="opening" hidden>
    <p>Opening Pathya…</p>
  </section>
  <section id="offline" hidden style="display:flex;flex-direction:column;gap:12px">
    <h1>Can't reach Pathya</h1>
    <p id="offline-why"></p>
    <button id="retry">Try again</button>
    <button id="change" class="ghost">Use a different link</button>
  </section>
  <form id="form" hidden style="display:flex;flex-direction:column;gap:12px">
    <h1>Connect to Pathya</h1>
    <p>Paste your Pathya link, the one with <b>?key=</b>. You can copy it from the server, or from More in the app on another phone.</p>
    <input id="link" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="https://….trycloudflare.com/?key=…">
    <p id="form-error" class="error" hidden></p>
    <button type="submit">Connect</button>
  </form>
</main>
<script>
  const SAVED = "pathya_link";
  const $ = (id) => document.getElementById(id);
  const show = (id) => ["opening", "offline", "form"].forEach((s) => ($(s).hidden = s !== id));

  function normalize(text) {
    let t = (text || "").trim();
    if (!t) return null;
    if (!/^https?:\/\//i.test(t)) t = "https://" + t;
    try {
      const u = new URL(t);
      return u.hostname.includes(".") || u.hostname === "localhost" ? u.toString() : null;
    } catch { return null; }
  }

  // Reachable when the server answers at all (no-cors: we only need to know the request got through).
  async function reachable(link) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try {
      await fetch(new URL("/manifest.webmanifest", link), { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
      return true;
    } catch { return false; } finally { clearTimeout(timer); }
  }

  async function open(link) {
    show("opening");
    if (await reachable(link)) { window.location.replace(link); return; }
    $("offline-why").textContent = `${new URL(link).host} is not answering. Check that the Pathya server and its tunnel ` +
      "are running. A restarted tunnel has a new link: paste the new one.";
    show("offline");
  }

  $("retry").onclick = () => open(localStorage.getItem(SAVED));
  $("change").onclick = () => { $("link").value = localStorage.getItem(SAVED) || ""; show("form"); };
  $("form").onsubmit = (e) => {
    e.preventDefault();
    const link = normalize($("link").value);
    $("form-error").hidden = !!link;
    if (!link) { $("form-error").textContent = "That doesn't look like a link."; return; }
    localStorage.setItem(SAVED, link);
    open(link);
  };

  const saved = localStorage.getItem(SAVED);
  if (saved && !new URLSearchParams(location.search).has("change")) open(saved);
  else { $("link").value = saved || ""; show("form"); }
</script>
</body>
</html>
